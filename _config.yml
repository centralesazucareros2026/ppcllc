title: "Pedroso Publishing"
description: "Publicación de libros, autopublicación, marketing editorial e inteligencia artificial para autores."
url: "https://centralesazucaceros2026.github.io"
baseurl: "/ppcll"
lang: es
timezone: America/New_York
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
paginate: 10
paginate_path: "/page:num/"
plugins:
  - jekyll-paginate
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Pedroso Publishing"
      image: ""
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
