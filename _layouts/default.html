<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} RSS" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Navegación principal">
        <a href="{{ '/' | relative_url }}">Inicio</a>
        <a href="{{ '/archivo/' | relative_url }}">Archivo</a>
        <a href="{{ '/acerca/' | relative_url }}">Acerca de</a>
      </nav>
    </div>
  </header>
  <main id="contenido" class="container">{{ content }}</main>
  <footer class="site-footer">
    <div class="container">
      <p>© {{ site.time | date: "%Y" }} {{ site.title }} · Todos los derechos reservados.</p>
    </div>
  </footer>
</body>
</html>
